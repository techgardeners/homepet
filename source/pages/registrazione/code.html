<!DOCTYPE html>
<html class="light" lang="en"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>PetBnB - Signup</title>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@200..800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#2280c3",
                        "primary-dark": "#1a659e",
                        "background-light": "#f6f5f3",
                        "background-dark": "#22262a",
                        "secondary-coral": "#F2A093",
                        "secondary-sage": "#9FCC9F",
                    },
                    fontFamily: {
                        "display": ["Manrope", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "1rem",
                        "xl": "1.5rem",
                        "2xl": "2rem",
                        "3xl": "2.5rem",
                        "full": "9999px"
                    },
                    boxShadow: {
                        'soft-xl': '0 20px 40px -10px rgba(0, 0, 0, 0.05)',
                        'soft-lg': '0 10px 25px -5px rgba(0, 0, 0, 0.04)',
                        'glass': '0 8px 32px 0 rgba(31, 38, 135, 0.07)',
                        'glass-inset': 'inset 0 0 0 1px rgba(255, 255, 255, 0.18)'
                    },
                    letterSpacing: {
                        'editorial': '0.05em'
                    }
                },
            },
        }
    </script>
<style>
        html, body {
            height: 100%;
        }
        .glass-panel-deep {
            background: rgba(255, 255, 255, 0.65);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.6);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.15);
        }
        .glass-button-shine {
            position: relative;
            overflow: hidden;
        }
        .glass-button-shine::after {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,0.2), transparent);
            transition: 0.5s;
        }
        .glass-button-shine:hover::after {
            left: 100%;
        }.input-minimal {
            background: transparent;
            border: none;
            border-bottom: 1px solid #d1d5db;
            padding: 0.75rem 0;
            transition: all 0.3s ease;
        }
        .input-minimal:focus {
            ring: 0;
            border-bottom-color: #2280c3;
            box-shadow: none;
            outline: none;
        }.checkbox-round {
            border-radius: 4px;
            border: 1px solid #d1d5db;
            color: #2280c3;
        }
    </style>
</head>
<body class="bg-background-light dark:bg-background-dark font-display text-[#2D2D2D] dark:text-[#f0f3f4] antialiased overflow-hidden">
<div class="fixed inset-0 z-0">
<div class="w-full h-full bg-cover bg-center" style="background-image: url('https://lh3.googleusercontent.com/aida-public/AB6AXuAJXv0sN8iasyPyT2CcE58Uo1Wcdw3FLd89Q_ODDCSvTNz9GB_BnnRPQqQadbf1z_gp5yz7z1_47zIIFjMqGXDtguYtca4Cx-Kut_XOhWQwKPJa2vYq9dyAuCpw87Pz_HRfmuTkj0f2iJE5REYrjMFLBfonQWHCRxOqYHtj9zCAb_qxLRS-TjCfYrnyQTbIgkQFEOzgLMOs-WKtgkIz_-NMmPFXlyID8acuUPScybis73k9SWc8drB9v8BSXSLrsiBIXpkHYtVo1Pet'); filter: blur(4px) brightness(1.1);"></div>
<div class="absolute inset-0 bg-white/20 dark:bg-black/30 backdrop-blur-[2px]"></div>
</div>
<nav class="fixed top-0 left-0 right-0 z-50 p-6 md:p-8">
<div class="flex items-center justify-between max-w-[1440px] mx-auto">
<a class="flex items-center gap-2 group" href="#">
<div class="flex h-10 w-10 items-center justify-center rounded-full bg-white/80 backdrop-blur-md shadow-sm text-primary group-hover:scale-110 transition-transform">
<span class="material-symbols-outlined !text-[24px]">pets</span>
</div>
<h2 class="text-[#121517] text-xl font-extrabold tracking-tight drop-shadow-sm">PetBnB</h2>
</a>
</div>
</nav>
<main class="relative z-10 w-full h-full flex items-center justify-center p-4">
<div class="glass-panel-deep w-full max-w-[480px] rounded-3xl p-8 md:p-12 animate-fade-in-up">
<div class="flex mb-10 bg-gray-100/50 p-1.5 rounded-full relative">
<div class="w-1/2 h-full absolute left-0 top-0 p-1.5 transition-all duration-300 transform translate-x-0">
<div class="w-full h-full bg-white shadow-sm rounded-full"></div>
</div>
<button class="flex-1 relative z-10 py-2 text-center text-sm font-bold text-[#121517] transition-colors">Sign Up</button>
<button class="flex-1 relative z-10 py-2 text-center text-sm font-semibold text-gray-500 hover:text-[#121517] transition-colors">Log In</button>
</div>
<div class="text-center mb-8">
<h1 class="text-3xl font-extrabold text-[#121517] mb-2 tracking-tight">Create Account</h1>
<p class="text-[#657886] text-sm font-medium">Join our community of pet lovers</p>
</div>
<div class="grid grid-cols-2 gap-4 mb-8">
<button class="flex items-center justify-center gap-3 py-2.5 px-4 bg-white/60 hover:bg-white border border-white/40 rounded-xl transition-all duration-200 hover:shadow-md group">
<img alt="Google" class="w-5 h-5 filter grayscale opacity-70 group-hover:grayscale-0 group-hover:opacity-100 transition-all" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB_gVkE3fnWXhQfyi2IoAhoXre_OMqPcdJzlmNsvpyPOOiMrmg9K68hQ1ZXwQ0vdj6CfeRO0wQD71LnBJYUHjOmOzK1-sb8wqcW8o7Tp7ZE87mb6PzEQBtzKH3Cq2k21WTPnTAK4cQwQY9jtuem89Ku3B7PekLn_h3RNO3EFvxNIsXEiGQI2jlH77tNPz16KVwry_fVJqrE70Uu9hz4yMyXSZmALEzdn5dmKTtQSRu-eoX5K9XIALPg6JPKHeJbKAv8jCQDUJZ0kDll"/>
<span class="text-sm font-semibold text-gray-700">Google</span>
</button>
<button class="flex items-center justify-center gap-3 py-2.5 px-4 bg-white/60 hover:bg-white border border-white/40 rounded-xl transition-all duration-200 hover:shadow-md group">
<span class="material-symbols-outlined text-[22px] text-gray-600 group-hover:text-black transition-colors">ios</span>
<span class="text-sm font-semibold text-gray-700">Apple</span>
</button>
</div>
<div class="relative flex py-2 items-center mb-8">
<div class="flex-grow border-t border-gray-300/50"></div>
<span class="flex-shrink-0 mx-4 text-gray-400 text-xs font-semibold uppercase tracking-wider">Or continue with</span>
<div class="flex-grow border-t border-gray-300/50"></div>
</div>
<form class="space-y-6">
<div class="space-y-1">
<label class="block text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Full Name</label>
<input class="input-minimal w-full placeholder-gray-400 bg-transparent focus:ring-0 text-[#121517] font-medium" placeholder="e.g. Sarah Smith" type="text"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Email Address</label>
<input class="input-minimal w-full placeholder-gray-400 bg-transparent focus:ring-0 text-[#121517] font-medium" placeholder="name@example.com" type="email"/>
</div>
<div class="space-y-1">
<label class="block text-xs font-bold text-gray-500 uppercase tracking-wide ml-1">Password</label>
<div class="relative">
<input class="input-minimal w-full placeholder-gray-400 bg-transparent focus:ring-0 text-[#121517] font-medium pr-10" placeholder="••••••••" type="password"/>
<button class="absolute right-0 top-1/2 -translate-y-1/2 text-gray-400 hover:text-gray-600" type="button">
<span class="material-symbols-outlined text-[20px]">visibility_off</span>
</button>
</div>
</div>
<div class="flex items-start gap-3 mt-6">
<div class="flex items-center h-5">
<input class="checkbox-round h-4 w-4 bg-white/50 border-gray-300 rounded focus:ring-primary/50 text-primary transition duration-150 ease-in-out" id="terms" name="terms" type="checkbox"/>
</div>
<div class="text-sm">
<label class="font-medium text-gray-600" for="terms">I agree to the <a class="text-primary hover:text-primary-dark hover:underline" href="#">Terms</a> and <a class="text-primary hover:text-primary-dark hover:underline" href="#">Privacy Policy</a></label>
</div>
</div>
<button class="glass-button-shine w-full py-4 px-6 rounded-xl bg-primary hover:bg-primary-dark text-white font-bold text-base shadow-lg hover:shadow-xl hover:-translate-y-0.5 transition-all duration-300 mt-2" type="submit">
                    Create Account
                </button>
</form>
<div class="mt-8 text-center">
<p class="text-sm text-gray-600">Already a member? <a class="font-bold text-primary hover:text-primary-dark transition-colors" href="#">Log In</a></p>
</div>
</div>
<div class="absolute bottom-6 left-0 right-0 flex justify-center gap-6 text-xs font-medium text-gray-500/80">
<a class="hover:text-gray-800 transition-colors" href="#">Help</a>
<a class="hover:text-gray-800 transition-colors" href="#">Privacy</a>
<a class="hover:text-gray-800 transition-colors" href="#">Terms</a>
</div>
</main>

</body></html>
